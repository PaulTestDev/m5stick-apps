name: Generate manifest

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 - <<'EOF'
          import json, os

          apps = {}
          apps_dir = "apps"

          for app_name in sorted(os.listdir(apps_dir)):
              meta_path = os.path.join(apps_dir, app_name, "meta.json")
              if os.path.isfile(meta_path):
                  with open(meta_path) as f:
                      meta = json.load(f)
                  apps[app_name] = {
                      "name": meta.get("name", app_name),
                      "version": meta.get("version", 1)
                  }

          manifest = {"apps": apps}
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print("manifest.json généré :", json.dumps(manifest, indent=2))
          EOF

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "chore: update manifest.json"
          git push
